<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#cbd5e1" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="0" y="0" width="1600" height="120" fill="#1B75BC" />
  <text x="800" y="70" font-weight="900" font-size="36" fill="white" text-anchor="middle">ADWYA PharmaTech Hub : Cartographie Stratégique</text>

  <!-- SECTION 1 : POUR QUI ? -->
  <rect x="100" y="140" width="1400" height="50" rx="10" fill="#e2e8f0" />
  <svg x="700" y="147" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  </svg>
  <text x="750" y="174" font-weight="bold" font-size="24" fill="#334155" text-anchor="start">POUR QUI ? (Les Acteurs)</text>

  <!-- Boxes Pour Qui -->
  <rect x="100" y="220" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#1B75BC" stroke-width="3" />
  <svg x="120" y="240" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1B75BC" stroke-width="2">
    <path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/>
  </svg>
  <text x="165" y="262" font-weight="bold" font-size="20" fill="#1e293b">Chercheurs &amp; Bio-Ingénieurs</text>
  <foreignObject x="120" y="280" width="380" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      Les scientifiques en R&amp;D chargés de concevoir et tester les formulations galéniques des futurs médicaments.
    </div>
  </foreignObject>

  <rect x="590" y="220" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3" />
  <svg x="610" y="240" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
  </svg>
  <text x="655" y="262" font-weight="bold" font-size="20" fill="#1e293b">Directeurs Qualité (QA/RA)</text>
  <foreignObject x="610" y="280" width="380" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      Les pharmaciens responsables d'assurer la conformité légale et la traçabilité absolue des procédures.
    </div>
  </foreignObject>

  <rect x="1080" y="220" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#ef4444" stroke-width="3" />
  <svg x="1100" y="240" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
    <rect width="16" height="12" x="1" y="8" rx="2" ry="2"/><path d="M17 14h4.5a.5.5 0 0 0 .5-.5V11l-3-3h-2"/><path d="M1 14h2"/><circle cx="5" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>
  </svg>
  <text x="1145" y="262" font-weight="bold" font-size="20" fill="#1e293b">Supply Chain &amp; Achats</text>
  <foreignObject x="1100" y="280" width="380" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      Les gestionnaires logistiques garantissant l'approvisionnement continu des principes actifs vers l'usine.
    </div>
  </foreignObject>


  <!-- ARROWS DOWN -->
  <path d="M 310 385 L 310 425" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 800 385 L 800 425" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 1290 385 L 1290 425" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />


  <!-- SECTION 2 : POURQUOI ? -->
  <rect x="100" y="440" width="1400" height="50" rx="10" fill="#e2e8f0" />
  <svg x="600" y="447" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
  </svg>
  <text x="650" y="474" font-weight="bold" font-size="24" fill="#334155" text-anchor="start">POURQUOI ? (Leur Problématique Actuelle)</text>

  <!-- Boxes Pourquoi -->
  <rect x="100" y="520" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="2" />
  <foreignObject x="120" y="540" width="380" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #334155; line-height: 1.5;">
      <strong>Formulation à l'aveugle</strong><br/><br/>
      Les tests sont faits en laboratoire physique (coûteux). Impossible de vérifier instantanément si deux composants vont réagir de manière instable avant l'essai.
    </div>
  </foreignObject>

  <rect x="590" y="520" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="2" />
  <foreignObject x="610" y="540" width="380" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #334155; line-height: 1.5;">
      <strong>Sécurité et Audit défaillants</strong><br/><br/>
      Les fichiers Excel peuvent être altérés sans trace. Si un audit de l'Agence du Médicament a lieu, la chaîne de validation des recettes manque de garantie cryptographique.
    </div>
  </foreignObject>

  <rect x="1080" y="520" width="420" height="150" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="2" />
  <foreignObject x="1100" y="540" width="380" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #334155; line-height: 1.5;">
      <strong>Pénuries non anticipées</strong><br/><br/>
      L'écosystème pharmaceutique est mondialisé. Lorsqu'un sous-traitant asiatique fait défaut, la production entière de l'entreprise (ex: ADWYA) est paralysée net.
    </div>
  </foreignObject>


  <!-- ARROWS DOWN -->
  <path d="M 310 685 L 310 725" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 800 685 L 800 725" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 1290 685 L 1290 725" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)" />


  <!-- SECTION 3 : COMMENT ? -->
  <rect x="100" y="740" width="1400" height="50" rx="10" fill="#e2e8f0" />
  <svg x="560" y="747" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2">
    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  </svg>
  <text x="610" y="774" font-weight="bold" font-size="24" fill="#334155" text-anchor="start">COMMENT ? (La Solution ADWYA PharmaTech)</text>

  <!-- Boxes Comment -->
  <rect x="100" y="820" width="420" height="220" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#60B246" stroke-width="4" />
  <svg x="120" y="840" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60B246" stroke-width="2">
    <polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
  </svg>
  <text x="165" y="862" font-weight="bold" font-size="20" fill="#1e293b">Laboratoire Numérique</text>
  <foreignObject x="120" y="880" width="380" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      <strong>• Modèles 3Dmol.js :</strong> Rendu de la structure moléculaire directement dans l'interface web.<br/>
      <strong>• Prédiction ML (ADMET) :</strong> Anticipation logicielle des incompatibilités lors du mélange des excipients, évitant les essais inutiles à la paillasse.
    </div>
  </foreignObject>

  <rect x="590" y="820" width="420" height="220" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#60B246" stroke-width="4" />
  <svg x="610" y="840" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60B246" stroke-width="2">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><rect x="9" y="9" width="6" height="6" rx="1"/>
  </svg>
  <text x="655" y="862" font-weight="bold" font-size="20" fill="#1e293b">Conformité Stricte (GXP)</text>
  <foreignObject x="610" y="880" width="380" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      <strong>• Audit Trail (21 CFR Part 11) :</strong> Journal crypté inaltérable. Chaque modification est liée nominativement.<br/>
      <strong>• Signature Électronique :</strong> Validation sécurisée et versioning figé d'une recette avant son passage en statut de production industrielle.
    </div>
  </foreignObject>

  <rect x="1080" y="820" width="420" height="220" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#60B246" stroke-width="4" />
  <svg x="1100" y="840" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#60B246" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
  </svg>
  <text x="1145" y="862" font-weight="bold" font-size="20" fill="#1e293b">Bouclier Global &amp; Sourcing</text>
  <foreignObject x="1100" y="880" width="380" height="150">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 16px; color: #475569; line-height: 1.5;">
      <strong>• Cartographie Temps Réel :</strong> Base de données de tous les fournisseurs d'API par géographie.<br/>
      <strong>• Recommandations Back-up :</strong> Si l'usine principale ferme, l'algorithme propose 3 alternatives certifiées GMP disponibles mondialement.
    </div>
  </foreignObject>

</svg>
